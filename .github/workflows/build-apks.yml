name: Build Timer APKs

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Admin and CCTV APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        working-directory: timer-android
        run: chmod +x gradlew || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build CCTV App (Timer)
        working-directory: timer-android
        run: gradle :app-cctv:assembleDebug --stacktrace

      - name: Build Admin App (Timer Admin)
        working-directory: timer-android
        run: gradle :app-admin:assembleDebug --stacktrace

      - name: Upload CCTV APK (Timer)
        uses: actions/upload-artifact@v4
        with:
          name: Timer-CCTV-Debug
          path: timer-android/app-cctv/build/outputs/apk/debug/*.apk

      - name: Upload Admin APK (Timer Admin)
        uses: actions/upload-artifact@v4
        with:
          name: Timer-Admin-Debug
          path: timer-android/app-admin/build/outputs/apk/debug/*.apk
